<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Room Visualizer — Antara Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── ANTARA BRAND TOKENS ──────────────────────────────────────── */
:root {
  --gold:        #E9B9A3;
  --gold-bright: #F5CBBA;
  --gold-deep:   #C9906E;
  --gold-dim:    rgba(233,185,163,.5);
  --gold-glow:   rgba(233,185,163,.14);
  --gold-glow2:  rgba(233,185,163,.08);
  --plum:        #3B2D35;
  --plum-deep:   #2A1E27;
  --ink:         #0A0908;
  --dark:        #0D0C0B;
  --dark2:       #141210;
  --dark3:       #1E1B18;
  --dark4:       #2C2824;
  --dark5:       #3A3530;
  --cream:       #FFF8F0;
  --cream2:      #F2E8DE;
  --muted:       rgba(255,248,240,.5);
  --muted2:      rgba(255,248,240,.25);
  --muted3:      rgba(255,248,240,.12);

  --ff-display: 'Cormorant Garamond', serif;
  --ff-head:    'Raleway', sans-serif;
  --ff-body:    'Golos Text', sans-serif;

  --ease:   cubic-bezier(.4,0,.2,1);
  --ease-o: cubic-bezier(0,0,.2,1);
  --t:      .28s;
  --t-slow: .6s;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body {
  width:100%; height:100%; overflow:hidden;
  background:var(--ink); color:var(--cream);
  font-family:var(--ff-body);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button { font-family:inherit; cursor:pointer; border:none; background:none; }
a { text-decoration:none; color:inherit; }

/* ══════════════════════════════════════════════════════════════════
   LOADING SCREEN — cinematic reveal
══════════════════════════════════════════════════════════════════ */
#loader {
  position:fixed; inset:0; z-index:2000;
  background:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0;
  transition:opacity .8s var(--ease);
}
#loader.hide { opacity:0; pointer-events:none; }
.loader-eye {
  width:1px; height:0;
  background:var(--gold);
  margin-bottom:40px;
  transition:height 1.2s var(--ease), width .8s var(--ease) .4s;
}
#loader.reveal .loader-eye { height:80px; width:1px; }
.loader-brand {
  font-family:var(--ff-display);
  font-size:clamp(32px,5vw,56px);
  font-weight:300;
  color:var(--cream);
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(12px);
  transition:opacity .8s ease .6s, transform .8s ease .6s;
}
#loader.reveal .loader-brand { opacity:1; transform:translateY(0); }
.loader-brand em { color:var(--gold); font-style:normal; font-weight:400; }
.loader-sub {
  font-family:var(--ff-head);
  font-size:10px;
  font-weight:600;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:10px;
  opacity:0;
  transition:opacity .6s ease 1s;
}
#loader.reveal .loader-sub { opacity:1; }
.loader-progress {
  position:absolute; bottom:0; left:0; right:0; height:2px;
  background:var(--dark4);
}
.loader-fill {
  height:100%;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-bright));
  width:0%;
  transition:width .12s linear;
}

/* ══════════════════════════════════════════════════════════════════
   TOP BAR — editorial header
══════════════════════════════════════════════════════════════════ */
#topbar {
  position:fixed; top:0; left:0; right:0; height:64px; z-index:300;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(to bottom,rgba(13,12,11,.96) 0%,rgba(13,12,11,.0) 100%);
  pointer-events:none;
}
#topbar>* { pointer-events:auto; }
.tb-logo {
  font-family:var(--ff-display);
  font-size:20px;
  font-weight:400;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--cream);
}
.tb-logo em { color:var(--gold); font-style:normal; }
.tb-center {
  display:flex; align-items:center; gap:6px;
  font-family:var(--ff-head);
  font-size:10px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted2);
}
.tb-center::before, .tb-center::after {
  content:''; display:block; width:24px; height:1px; background:var(--gold-dim);
}
#tbRoomName { color:var(--gold); }
.tb-right { display:flex; gap:8px; align-items:center; }
.tb-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 20px; border-radius:2px;
  font-size:10px; font-weight:700;
  font-family:var(--ff-head); letter-spacing:.12em; text-transform:uppercase;
  transition:var(--t) var(--ease);
}
.tb-ghost {
  border:1px solid rgba(255,248,240,.15); color:var(--muted);
  background:rgba(255,248,240,.04); backdrop-filter:blur(12px);
}
.tb-ghost:hover { border-color:var(--gold-dim); color:var(--gold); background:rgba(233,185,163,.06); }
.tb-cta {
  background:var(--gold); color:var(--plum); border:1px solid var(--gold);
  font-weight:800;
}
.tb-cta:hover { background:var(--gold-bright); transform:translateY(-1px); box-shadow:0 8px 24px rgba(233,185,163,.3); }

/* ══════════════════════════════════════════════════════════════════
   MAIN SCENE
══════════════════════════════════════════════════════════════════ */
#canvas {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* Room scene perspective wrapper */
#scene {
  position:relative;
  width:100vw; height:100vh;
  perspective:1400px;
  perspective-origin:50% 45%;
  cursor:grab; user-select:none;
  transition:filter .5s ease;
}
#scene:active { cursor:grabbing; }
#scene.blurred { filter:blur(3px) brightness(.5) saturate(.6); }

/* ── AMBIENT BACKGROUND ──────────────── */
#ambient-bg {
  position:absolute; inset:0;
  transition:background .8s ease, opacity .6s ease;
  z-index:0;
}

/* ── ROOM BOX ────────────────────────── */
#room {
  position:absolute;
  width:1000px; height:580px;
  top:50%; left:50%;
  transform:translateX(-50%) translateY(-52%) rotateY(0deg);
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}

/* Faces */
.face {
  position:absolute;
  backface-visibility:hidden;
  transition:background .6s ease, background-image .6s ease;
  will-change:background;
}

/* Back wall — the hero surface */
#w-back {
  width:1000px; height:580px; top:0; left:0;
  transform:translateZ(-260px);
}

/* Left wall */
#w-left {
  width:520px; height:580px; top:0; left:0;
  transform:rotateY(90deg) translateZ(0) translateX(-260px);
  transform-origin:left center;
}
/* shadow on side walls */
#w-left::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to right, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 60%, transparent);
  pointer-events:none;
}

/* Right wall */
#w-right {
  width:520px; height:580px; top:0; right:0;
  transform:rotateY(-90deg) translateZ(0) translateX(260px);
  transform-origin:right center;
}
#w-right::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to left, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 60%, transparent);
  pointer-events:none;
}

/* Floor */
#w-floor {
  width:1000px; height:520px; bottom:0; left:0;
  transform:rotateX(90deg) translateZ(260px);
  transform-origin:bottom center;
}
#w-floor::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.4) 0%, transparent 50%);
  pointer-events:none;
}

/* Ceiling */
#w-ceil {
  width:1000px; height:370px; top:0; left:0;
  transform:rotateX(-90deg) translateZ(185px);
  transform-origin:top center;
  opacity:.75;
}

/* ── ARCHITECTURAL DETAILS LAYER ───── */
#arch-layer {
  position:absolute; inset:0;
  transform:translateZ(-258px);
  pointer-events:none;
}
/* Skirting board */
.skirting {
  position:absolute; bottom:0; left:0; right:0; height:10px;
  background:linear-gradient(to bottom, rgba(255,255,255,.12) 0%, rgba(0,0,0,.2) 100%);
}
/* Cornice / crown molding */
.cornice {
  position:absolute; top:0; left:0; right:0; height:16px;
  background:linear-gradient(to bottom, rgba(255,255,255,.08) 0%, transparent 100%);
}
/* Baseboard line */
.baseboard {
  position:absolute; bottom:10px; left:0; right:0; height:1px;
  background:rgba(255,255,255,.1);
}

/* ── WINDOW LIGHT SHAFT ─────────────── */
#window-light {
  position:absolute;
  top:0; right:15%; width:25%; height:100%;
  transform:translateZ(-257px);
  pointer-events:none;
  transition:opacity .8s ease;
}
.light-shaft {
  position:absolute;
  top:10%; left:20%;
  width:60%; height:55%;
  background:linear-gradient(160deg, rgba(255,240,200,.06) 0%, transparent 70%);
  clip-path:polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
}
.light-pool {
  position:absolute;
  bottom:0; left:5%; right:5%;
  height:40%;
  background:radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,235,180,.07) 0%, transparent 70%);
}

/* ── FURNITURE LAYER ────────────────── */
#furniture-layer {
  position:absolute;
  width:1000px; height:580px; top:0; left:0;
  transform:translateZ(-250px);
  display:flex; align-items:flex-end; justify-content:center; gap:24px;
  padding-bottom:64px;
  pointer-events:none;
  transition:opacity .5s;
}
.furn-item {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:clamp(44px,4.5vw,72px);
  filter:drop-shadow(0 12px 24px rgba(0,0,0,.7)) drop-shadow(0 4px 8px rgba(0,0,0,.5));
  animation:furnFloat 7s ease-in-out infinite;
  transition:filter .4s ease;
}
.furn-item:nth-child(2) { animation-delay:1.4s; }
.furn-item:nth-child(3) { animation-delay:2.8s; }
.furn-item:nth-child(4) { animation-delay:.7s; }
.furn-item:nth-child(5) { animation-delay:2.1s; }
@keyframes furnFloat {
  0%,100% { transform:translateY(0) scale(1); }
  50%      { transform:translateY(-8px) scale(1.02); }
}

/* ── AMBIENT LIGHTING LAYER ─────────── */
#lighting-layer {
  position:absolute;
  width:1000px; height:580px; top:0; left:0;
  transform:translateZ(-248px);
  pointer-events:none;
  transition:opacity .6s;
}
.lspot {
  position:absolute; border-radius:50%;
  transition:background .8s ease, opacity .6s;
}
#ls-main {
  width:700px; height:320px; top:-80px; left:150px;
  background:radial-gradient(ellipse, rgba(255,235,180,.07) 0%, transparent 65%);
}
#ls-accent {
  width:380px; height:240px; bottom:30px; right:80px;
  background:radial-gradient(ellipse, rgba(233,185,163,.05) 0%, transparent 65%);
}
#ls-left {
  width:300px; height:400px; top:0; left:-60px;
  background:radial-gradient(ellipse, rgba(255,255,255,.04) 0%, transparent 70%);
}

/* ══════════════════════════════════════════════════════════════════
   HOTSPOTS — refined luxury style
══════════════════════════════════════════════════════════════════ */
.hotspot {
  position:absolute;
  width:36px; height:36px;
  transform:translateZ(-242px);
  cursor:pointer; pointer-events:auto;
}
.hs-dot {
  position:absolute; top:50%; left:50%;
  width:8px; height:8px; border-radius:50%;
  background:var(--gold);
  transform:translate(-50%,-50%);
  box-shadow:0 0 0 0 rgba(233,185,163,.6);
  animation:hsDot 2.8s ease-in-out infinite;
}
.hs-ring {
  width:36px; height:36px; border-radius:50%;
  border:1px solid rgba(233,185,163,.5);
  background:rgba(233,185,163,.08);
  backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center;
  transition:var(--t) var(--ease);
  animation:hsRing 2.8s ease-in-out infinite;
}
.hotspot:hover .hs-ring {
  border-color:var(--gold); background:rgba(233,185,163,.2);
  transform:scale(1.25);
}
@keyframes hsDot {
  0%,100% { box-shadow:0 0 0 0 rgba(233,185,163,.6); }
  50%      { box-shadow:0 0 0 10px rgba(233,185,163,0); }
}
@keyframes hsRing {
  0%,100% { opacity:1; }
  50%      { opacity:.7; }
}

/* Hotspot popup — editorial card */
.hs-popup {
  position:absolute;
  bottom:50px; left:50%;
  transform:translateX(-50%) translateY(8px) scale(.94);
  opacity:0; pointer-events:none;
  transition:var(--t) var(--ease);
  min-width:210px; max-width:260px;
  background:rgba(13,12,11,.9);
  backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(233,185,163,.2);
  border-radius:0;
  padding:16px 18px 14px;
  z-index:60;
}
.hs-popup::before {
  content:''; position:absolute;
  bottom:-6px; left:50%; transform:translateX(-50%);
  width:10px; height:10px;
  background:rgba(13,12,11,.9);
  border-right:1px solid rgba(233,185,163,.2);
  border-bottom:1px solid rgba(233,185,163,.2);
  transform:translateX(-50%) rotate(45deg);
}
.hotspot:hover .hs-popup, .hotspot.open .hs-popup {
  opacity:1; transform:translateX(-50%) translateY(0) scale(1); pointer-events:auto;
}
.hs-eyebrow {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep);
  margin-bottom:6px;
}
.hs-title {
  font-family:var(--ff-display); font-size:16px; font-weight:400;
  color:var(--cream); margin-bottom:6px; line-height:1.2;
}
.hs-body {
  font-size:11.5px; color:var(--muted); line-height:1.55;
}
.hs-tag {
  display:inline-block; margin-top:10px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  padding:3px 10px; background:rgba(233,185,163,.12);
  color:var(--gold); border:1px solid rgba(233,185,163,.2);
}

/* ══════════════════════════════════════════════════════════════════
   BOTTOM CONTROL PANEL — like MG, but luxury editorial
══════════════════════════════════════════════════════════════════ */
#bottom-panel {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:linear-gradient(to top, rgba(10,9,8,.97) 55%, transparent);
  padding:16px 32px 28px;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:14px;
  pointer-events:none;
}
#bottom-panel>* { pointer-events:auto; }

/* ── Room Tabs ── */
.room-tabs {
  display:flex; gap:0; justify-content:center;
  border-bottom:1px solid var(--dark5);
  padding-bottom:0;
}
.room-tab {
  padding:8px 20px 10px;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  font-family:var(--ff-head); font-size:10px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  display:flex; align-items:center; gap:7px;
  white-space:nowrap;
}
.room-tab span.ico { font-size:14px; }
.room-tab:hover { color:var(--gold-dim); }
.room-tab.active {
  color:var(--gold);
  border-bottom-color:var(--gold);
}

/* ── Finish Selector Row ── */
.finish-row {
  display:flex; align-items:center; gap:20px; justify-content:center;
}

/* Surface pills */
.surf-tabs {
  display:flex; gap:2px;
  background:var(--dark3); padding:3px; border-radius:2px;
}
.surf-tab {
  padding:5px 14px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted2); border-radius:1px;
  transition:var(--t) var(--ease);
}
.surf-tab.active {
  background:var(--dark5); color:var(--gold);
}
.surf-tab:hover:not(.active) { color:var(--gold-dim); }

/* Divider */
.fin-divider {
  width:1px; height:28px; background:var(--dark5);
  flex-shrink:0;
}

/* Dot track — exact MG pattern */
.dot-track {
  display:flex; align-items:center; gap:8px;
}
/* The dot itself */
.cdot {
  width:26px; height:26px; border-radius:50%;
  border:2px solid transparent;
  outline:2px solid transparent;
  outline-offset:3px;
  cursor:pointer;
  transition:var(--t) var(--ease);
  flex-shrink:0;
  position:relative;
}
.cdot:hover { transform:scale(1.18); }
.cdot.active {
  outline-color:var(--gold);
  transform:scale(1.22);
  box-shadow:0 0 12px rgba(233,185,163,.4);
}
/* tooltip */
.cdot::after {
  content:attr(data-tip);
  position:absolute; bottom:calc(100% + 10px); left:50%;
  transform:translateX(-50%) translateY(6px); opacity:0;
  background:var(--dark2); color:var(--cream);
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  padding:4px 10px; white-space:nowrap;
  border:1px solid var(--dark5);
  pointer-events:none;
  transition:var(--t) var(--ease);
}
.cdot:hover::after { opacity:1; transform:translateX(-50%) translateY(0); }

/* Current finish name */
.fin-name {
  font-family:var(--ff-display);
  font-size:15px; font-weight:300;
  font-style:italic;
  color:var(--cream2); letter-spacing:.04em;
  min-width:130px;
}
.fin-sub {
  font-family:var(--ff-head); font-size:9px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-deep); margin-top:1px;
}

/* ══════════════════════════════════════════════════════════════════
   LEFT PANEL — View mode column
══════════════════════════════════════════════════════════════════ */
#left-panel {
  position:fixed; left:24px; top:50%; transform:translateY(-50%);
  z-index:200; display:flex; flex-direction:column; gap:6px;
}
.vpill {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border:1px solid transparent;
  background:rgba(13,12,11,.7);
  backdrop-filter:blur(12px);
  border-radius:2px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  white-space:nowrap;
  overflow:hidden;
  max-width:38px;
  cursor:pointer;
}
.vpill:hover {
  max-width:180px; border-color:var(--gold-dim); color:var(--gold);
  background:rgba(233,185,163,.06);
}
.vpill.active {
  border-color:var(--gold); color:var(--gold);
  background:rgba(233,185,163,.1);
}
.vpill-ico { font-size:14px; flex-shrink:0; }

/* ══════════════════════════════════════════════════════════════════
   RIGHT PANEL — Style presets
══════════════════════════════════════════════════════════════════ */
#right-panel {
  position:fixed; right:24px; top:50%; transform:translateY(-50%);
  z-index:200; display:flex; flex-direction:column; gap:6px;
  align-items:flex-end;
}
.ppill {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border:1px solid transparent;
  background:rgba(13,12,11,.7);
  backdrop-filter:blur(12px);
  border-radius:2px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  white-space:nowrap;
  overflow:hidden;
  max-width:38px;
  flex-direction:row-reverse;
  cursor:pointer;
}
.ppill:hover {
  max-width:200px; border-color:var(--gold-dim); color:var(--gold);
  background:rgba(233,185,163,.06);
}
.ppill.active {
  border-color:var(--gold); color:var(--gold);
  background:rgba(233,185,163,.1);
}
.ppill-ico { font-size:14px; flex-shrink:0; }

/* Preset swatch line */
.ppill-swatch {
  width:12px; height:12px; border-radius:50%;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.15);
}

/* ══════════════════════════════════════════════════════════════════
   DRAG HINT — minimal & elegant
══════════════════════════════════════════════════════════════════ */
#drag-hint {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:150; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  opacity:1; transition:opacity .8s ease;
}
#drag-hint.hide { opacity:0; }
.dh-line {
  width:1px; height:0; background:var(--gold);
  transition:height 1s var(--ease) .3s;
}
#drag-hint.show .dh-line { height:40px; }
.dh-circle {
  width:52px; height:52px; border-radius:50%;
  border:1px solid rgba(233,185,163,.35);
  display:flex; align-items:center; justify-content:center;
  animation:dhPulse 2s ease-in-out infinite;
}
.dh-arrow {
  display:flex; gap:8px; align-items:center;
}
.dh-arrow svg { width:16px; height:16px; fill:none; stroke:var(--gold); stroke-width:1.5; opacity:.8; }
.dh-label {
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase; color:var(--gold-dim);
}
@keyframes dhPulse {
  0%,100% { transform:scale(1); border-color:rgba(233,185,163,.35); }
  50%      { transform:scale(1.1); border-color:rgba(233,185,163,.65); }
}

/* ══════════════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════════════ */
#spec-panel {
  position:fixed; right:0; top:0; bottom:0; width:340px; z-index:400;
  background:rgba(10,9,8,.96);
  backdrop-filter:blur(32px) saturate(1.4);
  border-left:1px solid rgba(233,185,163,.12);
  transform:translateX(100%);
  transition:transform .5s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
  overflow:hidden;
}
#spec-panel.open { transform:translateX(0); }

.sp-header {
  padding:72px 28px 24px;
  border-bottom:1px solid rgba(233,185,163,.1);
  position:relative;
}
.sp-close {
  position:absolute; top:20px; right:20px;
  width:32px; height:32px;
  border:1px solid rgba(255,248,240,.12);
  color:var(--muted);
  display:flex; align-items:center; justify-content:center;
  font-size:14px;
  transition:var(--t) var(--ease);
  border-radius:50%;
}
.sp-close:hover { border-color:var(--gold); color:var(--gold); }
.sp-eyebrow {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase; color:var(--gold-deep);
  margin-bottom:8px;
}
.sp-title {
  font-family:var(--ff-display);
  font-size:28px; font-weight:300; line-height:1.15;
  color:var(--cream);
}
.sp-body { flex:1; overflow-y:auto; padding:24px 28px; display:flex; flex-direction:column; gap:0; }
.sp-body::-webkit-scrollbar { width:3px; }
.sp-body::-webkit-scrollbar-track { background:transparent; }
.sp-body::-webkit-scrollbar-thumb { background:var(--dark5); border-radius:2px; }
.sp-item {
  padding:14px 0;
  border-bottom:1px solid rgba(255,248,240,.06);
  display:flex; flex-direction:column; gap:4px;
}
.sp-item:last-child { border-bottom:none; }
.sp-lbl {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep);
}
.sp-val {
  font-family:var(--ff-body); font-size:13px; color:var(--muted); line-height:1.5;
}
.sp-footer {
  padding:20px 28px;
  border-top:1px solid rgba(233,185,163,.1);
}
.sp-cta {
  width:100%; padding:14px;
  background:var(--gold); color:var(--plum);
  font-family:var(--ff-head); font-size:10px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase;
  border-radius:1px;
  transition:var(--t) var(--ease);
}
.sp-cta:hover { background:var(--gold-bright); box-shadow:0 8px 32px rgba(233,185,163,.3); }

/* ══════════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════════ */
#toast {
  position:fixed; bottom:160px; left:50%;
  transform:translateX(-50%) translateY(16px);
  background:rgba(13,12,11,.95);
  border:1px solid rgba(233,185,163,.2);
  color:var(--cream); padding:10px 24px;
  font-family:var(--ff-head); font-size:10px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  z-index:600; white-space:nowrap;
  backdrop-filter:blur(16px);
  opacity:0;
  transition:.35s var(--ease);
  pointer-events:none;
}
#toast.show {
  opacity:1; transform:translateX(-50%) translateY(0);
}

/* ══════════════════════════════════════════════════════════════════
   WATERMARK / BRAND STAMP
══════════════════════════════════════════════════════════════════ */
#watermark {
  position:fixed; bottom:170px; right:24px; z-index:100;
  pointer-events:none;
  display:flex; flex-direction:column; align-items:flex-end; gap:2px;
  opacity:.35;
}
.wm-line {
  font-family:var(--ff-display);
  font-size:9px; letter-spacing:.22em; text-transform:uppercase;

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let curRoom = 'living', curSurf = 'wall', curPreset = 'contemporary';
let rState = {};
Object.keys(ROOMS).forEach(r => { rState[r] = { wall:'ivory', floor:'oak', ceiling:'white_c' }; });
let isDrag = false, lastX = 0, curRotY = 0, targetRotY = 0;
let specOpen = false, dragHidden = false;

const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function finBg(list, id) {
  const f = list.find(x => x.id === id);
  if (!f) return '#272522';
  return f.g || f.c;
}
function finList(s) {
  return s === 'floor' ? FLOOR : s === 'ceiling' ? CEIL : WALL;
}
function finObj(s, id) { return finList(s).find(f => f.id === id); }

// ═══════════════════════════════════════════════════════════════
//  LOADER
// ═══════════════════════════════════════════════════════════════
function runLoader() {
  setTimeout(() => $('loader').classList.add('reveal'), 100);
  setTimeout(() => $('drag-hint').classList.add('show'), 200);
  let pct = 0;
  const fill = $('loaderFill');
  const iv = setInterval(() => {
    pct += Math.random() * 14 + 3;
    if (pct >= 100) { pct = 100; clearInterval(iv); setTimeout(hideLoader, 400); }
    fill.style.width = pct + '%';
  }, 130);
}
function hideLoader() {
  $('loader').classList.add('hide');
  setTimeout(() => { $('loader').style.display = 'none'; }, 900);
}

// ═══════════════════════════════════════════════════════════════
//  ROOM RENDER
// ═══════════════════════════════════════════════════════════════
function renderRoom(id) {
  const room = ROOMS[id];
  const rs = rState[id];

  const wbg = finBg(WALL,  rs.wall);
  const fbg = finBg(FLOOR, rs.floor);
  const cbg = finBg(CEIL,  rs.ceiling);

  // Apply the "is-gradient" vs "is-solid" class for future effects
  ['w-back','w-left','w-right'].forEach(w => { $(w).style.background = wbg; });
  $('w-floor').style.background = fbg;
  $('w-ceil').style.background  = cbg;
  $('ambient-bg').style.background = room.ambient;

  // Furniture
  $('furniture-layer').innerHTML = room.furniture
    .map((e, i) => `<div class="furn-item" style="animation-delay:${(i*0.45).toFixed(2)}s">${e}</div>`)
    .join('');

  // Hotspots
  $('hotspot-layer').innerHTML = room.hotspots.map((h, i) => `
    <div class="hotspot" style="top:${h.t};left:calc(${h.l} - 18px)" onclick="toggleHS(this,event)">
      <div class="hs-ring"></div>
      <div class="hs-dot"></div>
      <div class="hs-popup">
        <div class="hs-eyebrow">${h.ey}</div>
        <div class="hs-title">${h.title}</div>
        <div class="hs-body">${h.body}</div>
        <div class="hs-tag">${h.tag}</div>
      </div>
    </div>`).join('');

  // Top bar
  $('tbRoomName').textContent = room.name;
  $('spTitle').textContent    = room.name;

  // Spec body
  $('spBody').innerHTML = Object.entries(room.specs).map(([k,v]) => `
    <div class="sp-item">
      <div class="sp-lbl">${k}</div>
      <div class="sp-val">${v}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════
//  COLOUR DOTS
// ═══════════════════════════════════════════════════════════════
function renderDots(surf) {
  const list = finList(surf);
  const cur  = rState[curRoom][surf === 'ceiling' ? 'ceiling' : surf === 'floor' ? 'floor' : 'wall'];
  $('dotTrack').innerHTML = list.map(f => {
    const style = `background:${f.c}`;
    return `<button class="cdot ${f.id===cur?'active':''}"
      style="${style}" data-id="${f.id}" data-tip="${f.name}"
      onclick="pickFin('${f.id}')"></button>`;
  }).join('');
  updateFinLabel(surf, cur);
}
function updateFinLabel(surf, id) {
  const f = finObj(surf, id);
  if (!f) return;
  $('finName').textContent = f.name;
  $('finSub').textContent  = f.sub || '';
}
function pickFin(id) {
  const key = curSurf === 'ceiling' ? 'ceiling' : curSurf === 'floor' ? 'floor' : 'wall';
  rState[curRoom][key] = id;
  const bg = finBg(finList(curSurf), id);
  if (curSurf === 'wall') {
    ['w-back','w-left','w-right'].forEach(w => $(w).style.background = bg);
  } else if (curSurf === 'floor') {
    $('w-floor').style.background = bg;
  } else {
    $('w-ceil').style.background = bg;
  }
  document.querySelectorAll('.cdot').forEach(d => d.classList.toggle('active', d.dataset.id === id));
  updateFinLabel(curSurf, id);
}

// ═══════════════════════════════════════════════════════════════
//  ROOM / SURFACE SWITCH
// ═══════════════════════════════════════════════════════════════
function switchRoom(id) {
  curRoom = id;
  document.querySelectorAll('.room-tab').forEach(t => t.classList.toggle('active', t.dataset.room === id));
  renderRoom(id);
  renderDots(curSurf);
  curRotY = 0; targetRotY = 0;
}
function setSurf(s) {
  curSurf = s;
  document.querySelectorAll('.surf-tab').forEach(t => t.classList.toggle('active', t.dataset.s === s));
  renderDots(s);
}

// ═══════════════════════════════════════════════════════════════
//  PRESETS
// ═══════════════════════════════════════════════════════════════
function applyPreset(id) {
  curPreset = id;
  const p = PRESETS[id];
  Object.keys(rState).forEach(r => { rState[r] = { wall:p.wall, floor:p.floor, ceiling:p.ceiling }; });
  renderRoom(curRoom);
  renderDots(curSurf);
  document.querySelectorAll('.ppill').forEach(b => b.classList.remove('active'));
  const map = { contemporary:'pp-contemp', luxury:'pp-luxury', minimal:'pp-minimal', earthy:'pp-earthy', modern_indian:'pp-indian' };
  if (map[id]) $(map[id]).classList.add('active');
  toast(`${p.name} style applied across all rooms`);
}

// ═══════════════════════════════════════════════════════════════
//  VIEW MODES
// ═══════════════════════════════════════════════════════════════
function setView(v) {
  document.querySelectorAll('.vpill').forEach(b => b.classList.remove('active'));
  $('vp-'+v)?.classList.add('active');
  const s = $('scene');
  if (v === 'overview') { targetRotY = 0;   s.style.perspective = '1400px'; }
  if (v === 'walls')    { targetRotY = -18; s.style.perspective = '1000px'; }
  if (v === 'detail')   { targetRotY = 14;  s.style.perspective = '900px';  }
  if (v === 'floor') {
    $('room').style.transition = 'transform .9s cubic-bezier(.4,0,.2,1)';
    $('room').style.transform = `translateX(-50%) translateY(-30%) rotateX(-28deg)`;
    setTimeout(() => {
      $('room').style.transform = `translateX(-50%) translateY(-52%) rotateY(${curRotY}deg)`;
    }, 2200);
  }
}

// ═══════════════════════════════════════════════════════════════
//  DRAG ROTATION (smooth RAF)
// ═══════════════════════════════════════════════════════════════
const scene = $('scene');

scene.addEventListener('mousedown',  e => { isDrag=true; lastX=e.clientX; hideDH(); });
window.addEventListener('mousemove', e => {
  if (!isDrag) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  targetRotY = Math.max(-45, Math.min(45, targetRotY + dx * 0.22));
});
window.addEventListener('mouseup', () => { isDrag = false; });

scene.addEventListener('touchstart', e => { isDrag=true; lastX=e.touches[0].clientX; hideDH(); }, {passive:true});
scene.addEventListener('touchmove',  e => {
  if (!isDrag) return;
  const dx = e.touches[0].clientX - lastX; lastX = e.touches[0].clientX;
  targetRotY = Math.max(-45, Math.min(45, targetRotY + dx * 0.28));
}, {passive:true});
scene.addEventListener('touchend', () => { isDrag = false; });

function hideDH() {
  if (!dragHidden) { dragHidden = true; $('drag-hint').classList.remove('show'); $('drag-hint').classList.add('hide'); }
}

(function raf() {
  curRotY += (targetRotY - curRotY) * 0.1;
  if (Math.abs(targetRotY - curRotY) > 0.005) {
    $('room').style.transform = `translateX(-50%) translateY(-52%) rotateY(${curRotY.toFixed(3)}deg)`;
  }
  requestAnimationFrame(raf);
})();

// ═══════════════════════════════════════════════════════════════
//  HOTSPOT
// ═══════════════════════════════════════════════════════════════
function toggleHS(el, e) {
  e.stopPropagation();
  document.querySelectorAll('.hotspot.open').forEach(h => { if (h !== el) h.classList.remove('open'); });
  el.classList.toggle('open');
}
document.addEventListener('click', () => document.querySelectorAll('.hotspot.open').forEach(h => h.classList.remove('open')));

// ═══════════════════════════════════════════════════════════════
//  SPEC PANEL
// ═══════════════════════════════════════════════════════════════
function toggleSpec() { specOpen = !specOpen; $('spec-panel').classList.toggle('open', specOpen); $('scene').classList.toggle('blurred', specOpen); }
function closeSpec()  { specOpen = false; $('spec-panel').classList.remove('open'); $('scene').classList.remove('blurred'); }

// ═══════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════
let _tt;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 2800);
}

// ═══════════════════════════════════════════════════════════════
//  BOOK
// ═══════════════════════════════════════════════════════════════
function bookNow() {
  toast('Opening Antara Studios consultation...');
  setTimeout(() => window.open('https://antarastudios.com','_blank'), 700);
}

// ═══════════════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  targetRotY = Math.max(-45, targetRotY - 15);
  if (e.key === 'ArrowRight') targetRotY = Math.min(45,  targetRotY + 15);
  if (e.key === 'Escape')     closeSpec();
  if (e.key === 'r' || e.key === 'R') targetRotY = 0;
});

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
renderRoom('living');
renderDots('wall');
runLoader();

// Gentle auto-rotate on load
setTimeout(() => {
  let steps = 0, dir = 1;
  const id = setInterval(() => {
    targetRotY += dir * 2.5;
    if (Math.abs(targetRotY) > 18) dir *= -1;
    if (++steps > 16) { clearInterval(id); targetRotY = 0; }
  }, 220);
}, 2000);

// URL params
const P = new URLSearchParams(location.search);
if (P.get('room'))   switchRoom(P.get('room'));
if (P.get('preset')) setTimeout(() => applyPreset(P.get('preset')), 900);
</script>
