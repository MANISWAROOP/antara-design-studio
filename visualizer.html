<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Room Visualizer — Antara Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── ANTARA BRAND TOKENS ──────────────────────────────────────── */
:root {
  --gold:        #E9B9A3;
  --gold-bright: #F5CBBA;
  --gold-deep:   #C9906E;
  --gold-dim:    rgba(233,185,163,.5);
  --gold-glow:   rgba(233,185,163,.14);
  --gold-glow2:  rgba(233,185,163,.08);
  --plum:        #3B2D35;
  --plum-deep:   #2A1E27;
  --ink:         #0A0908;
  --dark:        #0D0C0B;
  --dark2:       #141210;
  --dark3:       #1E1B18;
  --dark4:       #2C2824;
  --dark5:       #3A3530;
  --cream:       #FFF8F0;
  --cream2:      #F2E8DE;
  --muted:       rgba(255,248,240,.5);
  --muted2:      rgba(255,248,240,.25);
  --muted3:      rgba(255,248,240,.12);

  --ff-display: 'Cormorant Garamond', serif;
  --ff-head:    'Raleway', sans-serif;
  --ff-body:    'Golos Text', sans-serif;

  --ease:   cubic-bezier(.4,0,.2,1);
  --ease-o: cubic-bezier(0,0,.2,1);
  --t:      .28s;
  --t-slow: .6s;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body {
  width:100%; height:100%; overflow:hidden;
  background:var(--ink); color:var(--cream);
  font-family:var(--ff-body);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button { font-family:inherit; cursor:pointer; border:none; background:none; }
a { text-decoration:none; color:inherit; }

/* ══════════════════════════════════════════════════════════════════
   LOADING SCREEN — cinematic reveal
══════════════════════════════════════════════════════════════════ */
#loader {
  position:fixed; inset:0; z-index:2000;
  background:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0;
  transition:opacity .8s var(--ease);
}
#loader.hide { opacity:0; pointer-events:none; }
.loader-eye {
  width:1px; height:0;
  background:var(--gold);
  margin-bottom:40px;
  transition:height 1.2s var(--ease), width .8s var(--ease) .4s;
}
#loader.reveal .loader-eye { height:80px; width:1px; }
.loader-brand {
  font-family:var(--ff-display);
  font-size:clamp(32px,5vw,56px);
  font-weight:300;
  color:var(--cream);
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(12px);
  transition:opacity .8s ease .6s, transform .8s ease .6s;
}
#loader.reveal .loader-brand { opacity:1; transform:translateY(0); }
.loader-brand em { color:var(--gold); font-style:normal; font-weight:400; }
.loader-sub {
  font-family:var(--ff-head);
  font-size:10px;
  font-weight:600;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:10px;
  opacity:0;
  transition:opacity .6s ease 1s;
}
#loader.reveal .loader-sub { opacity:1; }
.loader-progress {
  position:absolute; bottom:0; left:0; right:0; height:2px;
  background:var(--dark4);
}
.loader-fill {
  height:100%;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-bright));
  width:0%;
  transition:width .12s linear;
}

/* ══════════════════════════════════════════════════════════════════
   TOP BAR — editorial header
══════════════════════════════════════════════════════════════════ */
#topbar {
  position:fixed; top:0; left:0; right:0; height:64px; z-index:300;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(to bottom,rgba(13,12,11,.96) 0%,rgba(13,12,11,.0) 100%);
  pointer-events:none;
}
#topbar>* { pointer-events:auto; }
.tb-logo {
  font-family:var(--ff-display);
  font-size:20px;
  font-weight:400;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--cream);
}
.tb-logo em { color:var(--gold); font-style:normal; }
.tb-center {
  display:flex; align-items:center; gap:6px;
  font-family:var(--ff-head);
  font-size:10px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted2);
}
.tb-center::before, .tb-center::after {
  content:''; display:block; width:24px; height:1px; background:var(--gold-dim);
}
#tbRoomName { color:var(--gold); }
.tb-right { display:flex; gap:8px; align-items:center; }
.tb-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 20px; border-radius:2px;
  font-size:10px; font-weight:700;
  font-family:var(--ff-head); letter-spacing:.12em; text-transform:uppercase;
  transition:var(--t) var(--ease);
}
.tb-ghost {
  border:1px solid rgba(255,248,240,.15); color:var(--muted);
  background:rgba(255,248,240,.04); backdrop-filter:blur(12px);
}
.tb-ghost:hover { border-color:var(--gold-dim); color:var(--gold); background:rgba(233,185,163,.06); }
.tb-cta {
  background:var(--gold); color:var(--plum); border:1px solid var(--gold);
  font-weight:800;
}
.tb-cta:hover { background:var(--gold-bright); transform:translateY(-1px); box-shadow:0 8px 24px rgba(233,185,163,.3); }

/* ══════════════════════════════════════════════════════════════════
   MAIN SCENE
══════════════════════════════════════════════════════════════════ */
#canvas {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* Room scene perspective wrapper */
#scene {
  position:relative;
  width:100vw; height:100vh;
  perspective:1400px;
  perspective-origin:50% 45%;
  cursor:grab; user-select:none;
  transition:filter .5s ease;
}
#scene:active { cursor:grabbing; }
#scene.blurred { filter:blur(3px) brightness(.5) saturate(.6); }

/* ── AMBIENT BACKGROUND ──────────────── */
#ambient-bg {
  position:absolute; inset:0;
  transition:background .8s ease, opacity .6s ease;
  z-index:0;
}

/* ── ROOM BOX ────────────────────────── */
#room {
  position:absolute;
  width:1000px; height:580px;
  top:50%; left:50%;
  transform:translateX(-50%) translateY(-52%) rotateY(0deg);
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}

/* Faces */
.face {
  position:absolute;
  backface-visibility:hidden;
  transition:background .6s ease, background-image .6s ease;
  will-change:background;
}

/* Back wall — the hero surface */
#w-back {
  width:1000px; height:580px; top:0; left:0;
  transform:translateZ(-260px);
}

/* Left wall */
#w-left {
  width:520px; height:580px; top:0; left:0;
  transform:rotateY(90deg) translateZ(0) translateX(-260px);
  transform-origin:left center;
}
/* shadow on side walls */
#w-left::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to right, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 60%, transparent);
  pointer-events:none;
}

/* Right wall */
#w-right {
  width:520px; height:580px; top:0; right:0;
  transform:rotateY(-90deg) translateZ(0) translateX(260px);
  transform-origin:right center;
}
#w-right::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to left, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 60%, transparent);
  pointer-events:none;
}

/* Floor */
#w-floor {
  width:1000px; height:520px; bottom:0; left:0;
  transform:rotateX(90deg) translateZ(260px);
  transform-origin:bottom center;
}
#w-floor::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.4) 0%, transparent 50%);
  pointer-events:none;
}

/* Ceiling */
#w-ceil {
  width:1000px; height:370px; top:0; left:0;
  transform:rotateX(-90deg) translateZ(185px);
  transform-origin:top center;
  opacity:.75;
}

/* ── ARCHITECTURAL DETAILS LAYER ───── */
#arch-layer {
  position:absolute; inset:0;
  transform:translateZ(-258px);
  pointer-events:none;
}
/* Skirting board */
.skirting {
  position:absolute; bottom:0; left:0; right:0; height:10px;
  background:linear-gradient(to bottom, rgba(255,255,255,.12) 0%, rgba(0,0,0,.2) 100%);
}
/* Cornice / crown molding */
.cornice {
  position:absolute; top:0; left:0; right:0; height:16px;
  background:linear-gradient(to bottom, rgba(255,255,255,.08) 0%, transparent 100%);
}
/* Baseboard line */
.baseboard {
  position:absolute; bottom:10px; left:0; right:0; height:1px;
  background:rgba(255,255,255,.1);
}

/* ── WINDOW LIGHT SHAFT ─────────────── */
#window-light {
  position:absolute;
  top:0; right:15%; width:25%; height:100%;
  transform:translateZ(-257px);
  pointer-events:none;
  transition:opacity .8s ease;
}
.light-shaft {
  position:absolute;
  top:10%; left:20%;
  width:60%; height:55%;
  background:linear-gradient(160deg, rgba(255,240,200,.06) 0%, transparent 70%);
  clip-path:polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
}
.light-pool {
  position:absolute;
  bottom:0; left:5%; right:5%;
  height:40%;
  background:radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,235,180,.07) 0%, transparent 70%);
}

/* ── FURNITURE LAYER ────────────────── */
#furniture-layer {
  position:absolute;
  width:1000px; height:580px; top:0; left:0;
  transform:translateZ(-250px);
  display:flex; align-items:flex-end; justify-content:center; gap:24px;
  padding-bottom:64px;
  pointer-events:none;
  transition:opacity .5s;
}
.furn-item {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:clamp(44px,4.5vw,72px);
  filter:drop-shadow(0 12px 24px rgba(0,0,0,.7)) drop-shadow(0 4px 8px rgba(0,0,0,.5));
  animation:furnFloat 7s ease-in-out infinite;
  transition:filter .4s ease;
}
.furn-item:nth-child(2) { animation-delay:1.4s; }
.furn-item:nth-child(3) { animation-delay:2.8s; }
.furn-item:nth-child(4) { animation-delay:.7s; }
.furn-item:nth-child(5) { animation-delay:2.1s; }
@keyframes furnFloat {
  0%,100% { transform:translateY(0) scale(1); }
  50%      { transform:translateY(-8px) scale(1.02); }
}

/* ── AMBIENT LIGHTING LAYER ─────────── */
#lighting-layer {
  position:absolute;
  width:1000px; height:580px; top:0; left:0;
  transform:translateZ(-248px);
  pointer-events:none;
  transition:opacity .6s;
}
.lspot {
  position:absolute; border-radius:50%;
  transition:background .8s ease, opacity .6s;
}
#ls-main {
  width:700px; height:320px; top:-80px; left:150px;
  background:radial-gradient(ellipse, rgba(255,235,180,.07) 0%, transparent 65%);
}
#ls-accent {
  width:380px; height:240px; bottom:30px; right:80px;
  background:radial-gradient(ellipse, rgba(233,185,163,.05) 0%, transparent 65%);
}
#ls-left {
  width:300px; height:400px; top:0; left:-60px;
  background:radial-gradient(ellipse, rgba(255,255,255,.04) 0%, transparent 70%);
}

/* ══════════════════════════════════════════════════════════════════
   HOTSPOTS — refined luxury style
══════════════════════════════════════════════════════════════════ */
.hotspot {
  position:absolute;
  width:36px; height:36px;
  transform:translateZ(-242px);
  cursor:pointer; pointer-events:auto;
}
.hs-dot {
  position:absolute; top:50%; left:50%;
  width:8px; height:8px; border-radius:50%;
  background:var(--gold);
  transform:translate(-50%,-50%);
  box-shadow:0 0 0 0 rgba(233,185,163,.6);
  animation:hsDot 2.8s ease-in-out infinite;
}
.hs-ring {
  width:36px; height:36px; border-radius:50%;
  border:1px solid rgba(233,185,163,.5);
  background:rgba(233,185,163,.08);
  backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center;
  transition:var(--t) var(--ease);
  animation:hsRing 2.8s ease-in-out infinite;
}
.hotspot:hover .hs-ring {
  border-color:var(--gold); background:rgba(233,185,163,.2);
  transform:scale(1.25);
}
@keyframes hsDot {
  0%,100% { box-shadow:0 0 0 0 rgba(233,185,163,.6); }
  50%      { box-shadow:0 0 0 10px rgba(233,185,163,0); }
}
@keyframes hsRing {
  0%,100% { opacity:1; }
  50%      { opacity:.7; }
}

/* Hotspot popup — editorial card */
.hs-popup {
  position:absolute;
  bottom:50px; left:50%;
  transform:translateX(-50%) translateY(8px) scale(.94);
  opacity:0; pointer-events:none;
  transition:var(--t) var(--ease);
  min-width:210px; max-width:260px;
  background:rgba(13,12,11,.9);
  backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(233,185,163,.2);
  border-radius:0;
  padding:16px 18px 14px;
  z-index:60;
}
.hs-popup::before {
  content:''; position:absolute;
  bottom:-6px; left:50%; transform:translateX(-50%);
  width:10px; height:10px;
  background:rgba(13,12,11,.9);
  border-right:1px solid rgba(233,185,163,.2);
  border-bottom:1px solid rgba(233,185,163,.2);
  transform:translateX(-50%) rotate(45deg);
}
.hotspot:hover .hs-popup, .hotspot.open .hs-popup {
  opacity:1; transform:translateX(-50%) translateY(0) scale(1); pointer-events:auto;
}
.hs-eyebrow {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep);
  margin-bottom:6px;
}
.hs-title {
  font-family:var(--ff-display); font-size:16px; font-weight:400;
  color:var(--cream); margin-bottom:6px; line-height:1.2;
}
.hs-body {
  font-size:11.5px; color:var(--muted); line-height:1.55;
}
.hs-tag {
  display:inline-block; margin-top:10px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  padding:3px 10px; background:rgba(233,185,163,.12);
  color:var(--gold); border:1px solid rgba(233,185,163,.2);
}

/* ══════════════════════════════════════════════════════════════════
   BOTTOM CONTROL PANEL — like MG, but luxury editorial
══════════════════════════════════════════════════════════════════ */
#bottom-panel {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:linear-gradient(to top, rgba(10,9,8,.97) 55%, transparent);
  padding:16px 32px 28px;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:14px;
  pointer-events:none;
}
#bottom-panel>* { pointer-events:auto; }

/* ── Room Tabs ── */
.room-tabs {
  display:flex; gap:0; justify-content:center;
  border-bottom:1px solid var(--dark5);
  padding-bottom:0;
}
.room-tab {
  padding:8px 20px 10px;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  font-family:var(--ff-head); font-size:10px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  display:flex; align-items:center; gap:7px;
  white-space:nowrap;
}
.room-tab span.ico { font-size:14px; }
.room-tab:hover { color:var(--gold-dim); }
.room-tab.active {
  color:var(--gold);
  border-bottom-color:var(--gold);
}

/* ── Finish Selector Row ── */
.finish-row {
  display:flex; align-items:center; gap:20px; justify-content:center;
}

/* Surface pills */
.surf-tabs {
  display:flex; gap:2px;
  background:var(--dark3); padding:3px; border-radius:2px;
}
.surf-tab {
  padding:5px 14px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted2); border-radius:1px;
  transition:var(--t) var(--ease);
}
.surf-tab.active {
  background:var(--dark5); color:var(--gold);
}
.surf-tab:hover:not(.active) { color:var(--gold-dim); }

/* Divider */
.fin-divider {
  width:1px; height:28px; background:var(--dark5);
  flex-shrink:0;
}

/* Dot track — exact MG pattern */
.dot-track {
  display:flex; align-items:center; gap:8px;
}
/* The dot itself */
.cdot {
  width:26px; height:26px; border-radius:50%;
  border:2px solid transparent;
  outline:2px solid transparent;
  outline-offset:3px;
  cursor:pointer;
  transition:var(--t) var(--ease);
  flex-shrink:0;
  position:relative;
}
.cdot:hover { transform:scale(1.18); }
.cdot.active {
  outline-color:var(--gold);
  transform:scale(1.22);
  box-shadow:0 0 12px rgba(233,185,163,.4);
}
/* tooltip */
.cdot::after {
  content:attr(data-tip);
  position:absolute; bottom:calc(100% + 10px); left:50%;
  transform:translateX(-50%) translateY(6px); opacity:0;
  background:var(--dark2); color:var(--cream);
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  padding:4px 10px; white-space:nowrap;
  border:1px solid var(--dark5);
  pointer-events:none;
  transition:var(--t) var(--ease);
}
.cdot:hover::after { opacity:1; transform:translateX(-50%) translateY(0); }

/* Current finish name */
.fin-name {
  font-family:var(--ff-display);
  font-size:15px; font-weight:300;
  font-style:italic;
  color:var(--cream2); letter-spacing:.04em;
  min-width:130px;
}
.fin-sub {
  font-family:var(--ff-head); font-size:9px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-deep); margin-top:1px;
}

/* ══════════════════════════════════════════════════════════════════
   LEFT PANEL — View mode column
══════════════════════════════════════════════════════════════════ */
#left-panel {
  position:fixed; left:24px; top:50%; transform:translateY(-50%);
  z-index:200; display:flex; flex-direction:column; gap:6px;
}
.vpill {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border:1px solid transparent;
  background:rgba(13,12,11,.7);
  backdrop-filter:blur(12px);
  border-radius:2px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  white-space:nowrap;
  overflow:hidden;
  max-width:38px;
  cursor:pointer;
}
.vpill:hover {
  max-width:180px; border-color:var(--gold-dim); color:var(--gold);
  background:rgba(233,185,163,.06);
}
.vpill.active {
  border-color:var(--gold); color:var(--gold);
  background:rgba(233,185,163,.1);
}
.vpill-ico { font-size:14px; flex-shrink:0; }

/* ══════════════════════════════════════════════════════════════════
   RIGHT PANEL — Style presets
══════════════════════════════════════════════════════════════════ */
#right-panel {
  position:fixed; right:24px; top:50%; transform:translateY(-50%);
  z-index:200; display:flex; flex-direction:column; gap:6px;
  align-items:flex-end;
}
.ppill {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border:1px solid transparent;
  background:rgba(13,12,11,.7);
  backdrop-filter:blur(12px);
  border-radius:2px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  white-space:nowrap;
  overflow:hidden;
  max-width:38px;
  flex-direction:row-reverse;
  cursor:pointer;
}
.ppill:hover {
  max-width:200px; border-color:var(--gold-dim); color:var(--gold);
  background:rgba(233,185,163,.06);
}
.ppill.active {
  border-color:var(--gold); color:var(--gold);
  background:rgba(233,185,163,.1);
}
.ppill-ico { font-size:14px; flex-shrink:0; }

/* Preset swatch line */
.ppill-swatch {
  width:12px; height:12px; border-radius:50%;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.15);
}

/* ══════════════════════════════════════════════════════════════════
   DRAG HINT — minimal & elegant
══════════════════════════════════════════════════════════════════ */
#drag-hint {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:150; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  opacity:1; transition:opacity .8s ease;
}
#drag-hint.hide { opacity:0; }
.dh-line {
  width:1px; height:0; background:var(--gold);
  transition:height 1s var(--ease) .3s;
}
#drag-hint.show .dh-line { height:40px; }
.dh-circle {
  width:52px; height:52px; border-radius:50%;
  border:1px solid rgba(233,185,163,.35);
  display:flex; align-items:center; justify-content:center;
  animation:dhPulse 2s ease-in-out infinite;
}
.dh-arrow {
  display:flex; gap:8px; align-items:center;
}
.dh-arrow svg { width:16px; height:16px; fill:none; stroke:var(--gold); stroke-width:1.5; opacity:.8; }
.dh-label {
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase; color:var(--gold-dim);
}
@keyframes dhPulse {
  0%,100% { transform:scale(1); border-color:rgba(233,185,163,.35); }
  50%      { transform:scale(1.1); border-color:rgba(233,185,163,.65); }
}

/* ══════════════════════════════════════════════════════════════════
   SPEC PANEL — luxury editorial side sheet
══════════════════════════════════════════════════════════════════ */
#spec-panel {
  position:fixed; right:0; top:0; bottom:0; width:340px; z-index:400;
  background:rgba(10,9,8,.96);
  backdrop-filter:blur(32px) saturate(1.4);
  border-left:1px solid rgba(233,185,163,.12);
  transform:translateX(100%);
  transition:transform .5s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
  overflow:hidden;
}
#spec-panel.open { transform:translateX(0); }

.sp-header {
  padding:72px 28px 24px;
  border-bottom:1px solid rgba(233,185,163,.1);
  position:relative;
}
.sp-close {
  position:absolute; top:20px; right:20px;
  width:32px; height:32px;
  border:1px solid rgba(255,248,240,.12);
  color:var(--muted);
  display:flex; align-items:center; justify-content:center;
  font-size:14px;
  transition:var(--t) var(--ease);
  border-radius:50%;
}
.sp-close:hover { border-color:var(--gold); color:var(--gold); }
.sp-eyebrow {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase; color:var(--gold-deep);
  margin-bottom:8px;
}
.sp-title {
  font-family:var(--ff-display);
  font-size:28px; font-weight:300; line-height:1.15;
  color:var(--cream);
}
.sp-body { flex:1; overflow-y:auto; padding:24px 28px; display:flex; flex-direction:column; gap:0; }
.sp-body::-webkit-scrollbar { width:3px; }
.sp-body::-webkit-scrollbar-track { background:transparent; }
.sp-body::-webkit-scrollbar-thumb { background:var(--dark5); border-radius:2px; }
.sp-item {
  padding:14px 0;
  border-bottom:1px solid rgba(255,248,240,.06);
  display:flex; flex-direction:column; gap:4px;
}
.sp-item:last-child { border-bottom:none; }
.sp-lbl {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep);
}
.sp-val {
  font-family:var(--ff-body); font-size:13px; color:var(--muted); line-height:1.5;
}
.sp-footer {
  padding:20px 28px;
  border-top:1px solid rgba(233,185,163,.1);
}
.sp-cta {
  width:100%; padding:14px;
  background:var(--gold); color:var(--plum);
  font-family:var(--ff-head); font-size:10px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase;
  border-radius:1px;
  transition:var(--t) var(--ease);
}
.sp-cta:hover { background:var(--gold-bright); box-shadow:0 8px 32px rgba(233,185,163,.3); }

/* ══════════════════════════════════════════════════════════════════
   TOOLBAR — snapshot, share, wishlist, fullscreen, before/after
══════════════════════════════════════════════════════════════════ */
#toolbar {
  position:fixed; top:72px; left:50%; transform:translateX(-50%);
  z-index:250;
  display:flex; align-items:center; gap:6px;
  background:rgba(13,12,11,.82);
  backdrop-filter:blur(18px);
  border:1px solid rgba(233,185,163,.1);
  border-radius:2px;
  padding:5px 8px;
}
.tb-tool {
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:6px 14px;
  border-radius:1px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted2);
  transition:var(--t) var(--ease);
  white-space:nowrap; cursor:pointer;
  border:1px solid transparent;
}
.tb-tool svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; flex-shrink:0; }
.tb-tool:hover { color:var(--gold); border-color:rgba(233,185,163,.2); background:rgba(233,185,163,.06); }
.tb-tool.active { color:var(--gold); border-color:var(--gold); background:rgba(233,185,163,.1); }
.tb-tool.liked { color:#e9a3a3; border-color:rgba(233,163,163,.3); }
.tb-sep { width:1px; height:22px; background:var(--dark5); margin:0 2px; flex-shrink:0; }

/* ══════════════════════════════════════════════════════════════════
   SEARCH BAR — floating above bottom panel
══════════════════════════════════════════════════════════════════ */
#search-bar {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  z-index:210; width:320px;
  display:none;
  align-items:center; gap:8px;
  background:rgba(13,12,11,.94);
  border:1px solid rgba(233,185,163,.2);
  padding:8px 14px;
  backdrop-filter:blur(20px);
}
#search-bar.open { display:flex; }
#search-input {
  flex:1; background:none; border:none; outline:none;
  font-family:var(--ff-head); font-size:11px; font-weight:600;
  letter-spacing:.06em; color:var(--cream);
}
#search-input::placeholder { color:var(--muted2); }
.search-icon { color:var(--gold-deep); flex-shrink:0; }
.search-clear {
  color:var(--muted2); font-size:14px; cursor:pointer; flex-shrink:0;
  transition:color var(--t);
}
.search-clear:hover { color:var(--gold); }

/* ══════════════════════════════════════════════════════════════════
   MATERIAL TYPE FILTER — chips above dot track
══════════════════════════════════════════════════════════════════ */
#mat-filter {
  display:flex; align-items:center; gap:6px; overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
#mat-filter::-webkit-scrollbar { display:none; }
.mf-chip {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 12px; border-radius:20px;
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted2); border:1px solid var(--dark5);
  transition:var(--t) var(--ease); cursor:pointer; white-space:nowrap;
  flex-shrink:0;
}
.mf-chip:hover { border-color:var(--gold-dim); color:var(--gold-dim); }
.mf-chip.active { border-color:var(--gold); color:var(--gold); background:rgba(233,185,163,.08); }

/* ══════════════════════════════════════════════════════════════════
   LIGHTING MODE PANEL — top-left
══════════════════════════════════════════════════════════════════ */
#light-panel {
  position:fixed; left:24px; top:80px; z-index:210;
  display:flex; flex-direction:column; gap:4px;
}
.lpill {
  display:flex; align-items:center; gap:8px; padding:7px 12px;
  border:1px solid transparent; border-radius:2px;
  background:rgba(13,12,11,.7); backdrop-filter:blur(12px);
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted2);
  transition:var(--t) var(--ease); cursor:pointer; white-space:nowrap;
  overflow:hidden; max-width:30px;
}
.lpill:hover { max-width:160px; border-color:var(--gold-dim); color:var(--gold-dim); }
.lpill.active { border-color:var(--gold); color:var(--gold); background:rgba(233,185,163,.1); max-width:160px; }
.lpill-ico { font-size:12px; flex-shrink:0; }

/* ══════════════════════════════════════════════════════════════════
   GROUT PICKER — shown when a tile finish is active
══════════════════════════════════════════════════════════════════ */
#grout-row {
  display:none; align-items:center; gap:10px;
  padding-top:8px; margin-top:4px;
  border-top:1px solid var(--dark4);
}
#grout-row.visible { display:flex; }
.grout-label {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted2);
  white-space:nowrap; flex-shrink:0;
}
.gdot {
  width:20px; height:20px; border-radius:50%;
  border:2px solid transparent; outline:2px solid transparent;
  outline-offset:2px; cursor:pointer;
  transition:var(--t) var(--ease); flex-shrink:0;
}
.gdot:hover { transform:scale(1.2); }
.gdot.active { outline-color:var(--gold); transform:scale(1.22); }

/* ══════════════════════════════════════════════════════════════════
   PRODUCT DETAIL CARD — slides up from bottom when finish clicked
══════════════════════════════════════════════════════════════════ */
#product-card {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(100%);
  z-index:350; width:min(420px, 96vw);
  background:rgba(13,12,11,.97);
  border:1px solid rgba(233,185,163,.15);
  border-bottom:none;
  backdrop-filter:blur(32px);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  padding:0;
}
#product-card.open { transform:translateX(-50%) translateY(0); }
.pc-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px 12px;
  border-bottom:1px solid rgba(233,185,163,.08);
}
.pc-eyebrow {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep);
}
.pc-close {
  width:28px; height:28px; border-radius:50%;
  border:1px solid rgba(255,248,240,.1); color:var(--muted);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; cursor:pointer;
  transition:var(--t) var(--ease);
}
.pc-close:hover { border-color:var(--gold); color:var(--gold); }
.pc-body { display:flex; gap:16px; padding:16px 20px 20px; }
.pc-swatch {
  width:72px; height:72px; flex-shrink:0; border-radius:2px;
  border:1px solid rgba(255,255,255,.08);
}
.pc-info { flex:1; }
.pc-name {
  font-family:var(--ff-display); font-size:20px; font-weight:300;
  font-style:italic; color:var(--cream); margin-bottom:4px;
}
.pc-sub-label {
  font-family:var(--ff-head); font-size:9px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--gold-deep);
  margin-bottom:10px;
}
.pc-specs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.pc-spec {
  font-family:var(--ff-head); font-size:8px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  padding:3px 10px; background:rgba(255,248,240,.05);
  border:1px solid rgba(255,248,240,.1); color:var(--muted2);
}
.pc-actions { display:flex; gap:8px; padding:0 20px 20px; }
.pc-btn {
  flex:1; padding:10px; border-radius:1px;
  font-family:var(--ff-head); font-size:9px; font-weight:800;
  letter-spacing:.12em; text-transform:uppercase;
  transition:var(--t) var(--ease); cursor:pointer;
}
.pc-btn.primary { background:var(--gold); color:var(--plum); }
.pc-btn.primary:hover { background:var(--gold-bright); box-shadow:0 6px 20px rgba(233,185,163,.3); }
.pc-btn.ghost { border:1px solid rgba(233,185,163,.2); color:var(--gold); background:transparent; }
.pc-btn.ghost:hover { border-color:var(--gold); background:rgba(233,185,163,.06); }

/* ══════════════════════════════════════════════════════════════════
   BEFORE / AFTER SLIDER
══════════════════════════════════════════════════════════════════ */
#ba-overlay {
  position:fixed; inset:0; z-index:500;
  display:none; pointer-events:none;
}
#ba-overlay.active { display:block; pointer-events:auto; }
#ba-before, #ba-after {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#ba-before { clip-path:inset(0 50% 0 0); }
.ba-label {
  position:absolute; top:20px;
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase;
  padding:4px 12px; background:rgba(13,12,11,.8);
  border:1px solid rgba(233,185,163,.2); color:var(--gold);
  z-index:2; pointer-events:none;
}
#ba-before .ba-label { left:20px; }
#ba-after  .ba-label { right:20px; }
#ba-divider {
  position:absolute; top:0; bottom:0; left:50%; width:2px;
  background:var(--gold); z-index:3; cursor:ew-resize;
  transform:translateX(-50%);
}
#ba-handle {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:36px; height:36px; border-radius:50%;
  background:var(--gold); border:3px solid white;
  display:flex; align-items:center; justify-content:center;
  cursor:ew-resize; z-index:4;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
#ba-handle svg { width:16px; height:16px; fill:var(--plum); }
#ba-close {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  padding:6px 20px; z-index:10;
  background:rgba(13,12,11,.9); border:1px solid rgba(233,185,163,.25);
  font-family:var(--ff-head); font-size:9px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
  cursor:pointer; backdrop-filter:blur(12px);
}

/* ══════════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════════ */
#toast {
  position:fixed; bottom:160px; left:50%;
  transform:translateX(-50%) translateY(16px);
  background:rgba(13,12,11,.95);
  border:1px solid rgba(233,185,163,.2);
  color:var(--cream); padding:10px 24px;
  font-family:var(--ff-head); font-size:10px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  z-index:600; white-space:nowrap;
  backdrop-filter:blur(16px);
  opacity:0;
  transition:.35s var(--ease);
  pointer-events:none;
}
#toast.show {
  opacity:1; transform:translateX(-50%) translateY(0);
}

/* ══════════════════════════════════════════════════════════════════
   WATERMARK / BRAND STAMP
══════════════════════════════════════════════════════════════════ */
#watermark {
  position:fixed; bottom:170px; right:24px; z-index:100;
  pointer-events:none;
  display:flex; flex-direction:column; align-items:flex-end; gap:2px;
  opacity:.35;
}
.wm-line {
  font-family:var(--ff-display);
  font-size:9px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--cream);
}

/* ══════════════════════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════════════════════ */
@media(max-width:900px) {
  #toolbar { top:68px; padding:4px 6px; gap:4px; }
  .tb-tool span { display:none; }
  .tb-tool { padding:6px 10px; }
  #light-panel { display:none; }
}
@media(max-width:900px) {
  #room { width:720px; height:440px; }
  #w-back  { width:720px; height:440px; }
  #w-left  { width:380px; height:440px; transform:rotateY(90deg) translateZ(0) translateX(-190px); }
  #w-right { width:380px; height:440px; transform:rotateY(-90deg) translateZ(0) translateX(190px); }
  #w-floor { width:720px; height:380px; transform:rotateX(90deg) translateZ(190px); }
  #w-ceil  { width:720px; height:280px; transform:rotateX(-90deg) translateZ(140px); }
  #furniture-layer { width:720px; height:440px; padding-bottom:50px; }
  #lighting-layer  { width:720px; height:440px; }
  #arch-layer      { transform:translateZ(-258px); }
  #left-panel, #right-panel { display:none; }
  #spec-panel { width:100%; border-left:none; border-top:1px solid rgba(233,185,163,.12); }
  #watermark { display:none; }
  .room-tab { padding:8px 12px; }
}
@media(max-width:600px) {
  #room { width:460px; height:290px; }
  #w-back  { width:460px; height:290px; }
  #w-left  { width:240px; height:290px; transform:rotateY(90deg) translateZ(0) translateX(-120px); }
  #w-right { width:240px; height:290px; transform:rotateY(-90deg) translateZ(0) translateX(120px); }
  #w-floor { width:460px; height:240px; transform:rotateX(90deg) translateZ(120px); }
  #w-ceil  { width:460px; height:170px; transform:rotateX(-90deg) translateZ(85px); }
  #furniture-layer { width:460px; height:290px; padding-bottom:34px; gap:12px; }
  #lighting-layer  { width:460px; height:290px; }
  .furn-item { font-size:36px; }
  .room-tab .ico { display:none; }
  .room-tab { padding:8px 10px; font-size:9px; }
  #topbar { padding:0 16px; }
  #bottom-panel { padding:12px 16px 24px; }
  .tb-logo { font-size:16px; }
  .tb-btn { padding:7px 14px; font-size:9px; }
}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <div class="loader-eye" id="loaderEye"></div>
  <div class="loader-brand">ANTARA <em>STUDIOS</em></div>
  <div class="loader-sub">Room Visualizer</div>
  <div class="loader-progress"><div class="loader-fill" id="loaderFill"></div></div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <a href="index.html" class="tb-logo">ANTARA <em>STUDIOS</em></a>
  <div class="tb-center">
    <span id="tbRoomName">Living Room</span>
  </div>
  <div class="tb-right">
    <button class="tb-btn tb-ghost" onclick="toggleSpec()">✦ Specifications</button>
    <a href="index.html" class="tb-btn tb-ghost">← Designer</a>
    <button class="tb-btn tb-cta" onclick="bookNow()">Book Consultation</button>
  </div>
</div>

<!-- ═══ TOOLBAR ═══════════════════════════════════════════════════ -->
<div id="toolbar">
  <button class="tb-tool" id="btnSearch" onclick="toggleSearch()" title="Search finishes">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>Search</span>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-tool" id="btnBA" onclick="openBA()" title="Before / After">
    <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3v18"/><path d="M3 12l4-4M3 12l4 4"/><path d="M21 12l-4-4M21 12l-4 4"/></svg>
    <span>Before / After</span>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-tool" id="btnSnap" onclick="takeSnapshot()" title="Download snapshot">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>Snapshot</span>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-tool" id="btnShare" onclick="shareLink()" title="Share link">
    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
    <span>Share</span>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-tool" id="btnLike" onclick="toggleLike()" title="Wishlist">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
    <span>Wishlist</span>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-tool" id="btnFull" onclick="toggleFullscreen()" title="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M3 16v3a2 2 0 002 2h3"/></svg>
    <span>Fullscreen</span>
  </button>
</div>

<!-- ═══ SEARCH BAR ════════════════════════════════════════════════ -->
<div id="search-bar">
  <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
  <input id="search-input" type="text" placeholder="Search finishes…" oninput="filterFinishes(this.value)">
  <span class="search-clear" onclick="clearSearch()">✕</span>
</div>

<!-- ═══ LIGHTING PANEL ════════════════════════════════════════════ -->
<div id="light-panel">
  <button class="lpill active" data-light="warm" onclick="setLight('warm')"><span class="lpill-ico">🕯</span><span>Warm White</span></button>
  <button class="lpill" data-light="soft"        onclick="setLight('soft')"><span class="lpill-ico">💡</span><span>Soft White</span></button>
  <button class="lpill" data-light="day"         onclick="setLight('day')"><span class="lpill-ico">☀</span><span>Daylight</span></button>
  <button class="lpill" data-light="night"       onclick="setLight('night')"><span class="lpill-ico">🌙</span><span>Night Mode</span></button>
</div>

<!-- ═══ BEFORE / AFTER OVERLAY ══════════════════════════════════ -->
<div id="ba-overlay">
  <div id="ba-after">
    <div class="ba-label">After</div>
    <!-- filled by JS with current room snapshot canvas -->
  </div>
  <div id="ba-before">
    <div class="ba-label">Before</div>
    <!-- filled by JS with default room snapshot canvas -->

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function finBg(list, id) {
  const f = list.find(x => x.id === id);
  if (!f) return '#272522';
  return f.g || f.c;
}
function finList(s) {
  return s === 'floor' ? FLOOR : s === 'ceiling' ? CEIL : WALL;
}
function finObj(s, id) { return finList(s).find(f => f.id === id); }

// ═══════════════════════════════════════════════════════════════
function runLoader() {
  setTimeout(() => $('loader').classList.add('reveal'), 100);
  setTimeout(() => $('drag-hint').classList.add('show'), 200);
  let pct = 0;
  const fill = $('loaderFill');
  const iv = setInterval(() => {
    pct += Math.random() * 14 + 3;
    if (pct >= 100) { pct = 100; clearInterval(iv); setTimeout(hideLoader, 400); }
    fill.style.width = pct + '%';
  }, 130);
}
function hideLoader() {
  $('loader').classList.add('hide');
  setTimeout(() => { $('loader').style.display = 'none'; }, 900);
}

// ═══════════════════════════════════════════════════════════════
//  DRAG ROTATION (smooth RAF)
// ═══════════════════════════════════════════════════════════════
const scene = $('scene');

scene.addEventListener('mousedown',  e => { isDrag=true; lastX=e.clientX; hideDH(); });
window.addEventListener('mousemove', e => {
  if (!isDrag) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  targetRotY = Math.max(-45, Math.min(45, targetRotY + dx * 0.22));
});
window.addEventListener('mouseup', () => { isDrag = false; });

scene.addEventListener('touchstart', e => { isDrag=true; lastX=e.touches[0].clientX; hideDH(); }, {passive:true});
scene.addEventListener('touchmove',  e => {
  if (!isDrag) return;
  const dx = e.touches[0].clientX - lastX; lastX = e.touches[0].clientX;
  targetRotY = Math.max(-45, Math.min(45, targetRotY + dx * 0.28));
}, {passive:true});
scene.addEventListener('touchend', () => { isDrag = false; });

function hideDH() {
  if (!dragHidden) { dragHidden = true; $('drag-hint').classList.remove('show'); $('drag-hint').classList.add('hide'); }
}

(function raf() {
  curRotY += (targetRotY - curRotY) * 0.1;
  if (Math.abs(targetRotY - curRotY) > 0.005) {
    $('room').style.transform = `translateX(-50%) translateY(-52%) rotateY(${curRotY.toFixed(3)}deg)`;
  }
  requestAnimationFrame(raf);
})();

// ═══════════════════════════════════════════════════════════════
//  SNAPSHOT / DOWNLOAD
// ═══════════════════════════════════════════════════════════════
function takeSnapshot() {
  // Use html2canvas-style approach — build a share card as PNG via canvas
  const canvas = document.createElement('canvas');
  canvas.width  = 900; canvas.height = 560;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0A0908';
  ctx.fillRect(0, 0, 900, 560);

  // Room surfaces from state
  const rs = rState[curRoom];
  const wc = finObj('wall',    rs.wall)?.c    || '#EDE8DC';
  const fc = finObj('floor',   rs.floor)?.c   || '#B89060';
  const cc = finObj('ceiling', rs.ceiling)?.c || '#F4F2EC';

  // Draw simplified room box
  ctx.fillStyle = cc;
  ctx.fillRect(100, 40, 700, 120);  // ceiling strip
  ctx.fillStyle = wc;
  ctx.fillRect(100, 155, 700, 270); // back wall
  ctx.fillStyle = fc;
  ctx.fillRect(100, 420, 700, 100); // floor strip
  // Side shadow vignettes
  const lg = ctx.createLinearGradient(100,0,250,0);
  lg.addColorStop(0,'rgba(0,0,0,.45)'); lg.addColorStop(1,'transparent');
  ctx.fillStyle = lg; ctx.fillRect(100,155,160,270);
  const rg = ctx.createLinearGradient(850,0,700,0);
  rg.addColorStop(0,'rgba(0,0,0,.45)'); rg.addColorStop(1,'transparent');
  ctx.fillStyle = rg; ctx.fillRect(690,155,160,270);

  // Room name
  ctx.font = 'italic 300 36px Cormorant Garamond, serif';
  ctx.fillStyle = '#E9B9A3';
  ctx.textAlign = 'center';
  ctx.fillText(ROOMS[curRoom].name, 450, 510);

  // Brand
  ctx.font = '700 10px Raleway, sans-serif';
  ctx.fillStyle = 'rgba(233,185,163,.45)';
  ctx.letterSpacing = '0.2em';
  ctx.fillText('ANTARA STUDIOS · BANGALORE', 450, 540);

  // Download
  const a = document.createElement('a');
  a.download = `antara-${curRoom}-design.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('Snapshot downloaded ↓');
}

//  SHARE LINK
// ═══════════════════════════════════════════════════════════════
function shareLink() {
  const rs = rState[curRoom];
  const url = `${location.origin}${location.pathname}?room=${curRoom}&wall=${rs.wall}&floor=${rs.floor}&ceil=${rs.ceiling}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('Link copied to clipboard ✓'));
  } else {
    prompt('Copy this link:', url);
  }
}
// Apply wall/floor/ceil from URL params on load
if (P.get('wall'))  { const r=P.get('room')||'living'; rState[r].wall    = P.get('wall'); }
if (P.get('floor')) { const r=P.get('room')||'living'; rState[r].floor   = P.get('floor'); }
if (P.get('ceil'))  { const r=P.get('room')||'living'; rState[r].ceiling = P.get('ceil'); }

// ═══════════════════════════════════════════════════════════════
//  FULLSCREEN
// ═══════════════════════════════════════════════════════════════
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
    $('btnFull').classList.add('active');
    toast('Fullscreen — press Esc to exit');
  } else {
    document.exitFullscreen?.();
    $('btnFull').classList.remove('active');
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) $('btnFull').classList.remove('active');
});

// ═══════════════════════════════════════════════════════════════
//  BEFORE / AFTER SLIDER
// ═══════════════════════════════════════════════════════════════
let baSnapshotBefore = null;

function openBA() {
  // Capture current room colours as "before" (default preset)
  const def = PRESETS.contemporary;
  const beforeWall  = finBg(WALL,  def.wall);
  const beforeFloor = finBg(FLOOR, def.floor);
  const beforeCeil  = finBg(CEIL,  def.ceiling);
  const afterWall   = finBg(WALL,  rState[curRoom].wall);
  const afterFloor  = finBg(FLOOR, rState[curRoom].floor);
  const afterCeil   = finBg(CEIL,  rState[curRoom].ceiling);

  // Build mini room HTML for before & after panels
  function miniRoom(wc, fc, cc, label) {
    return `<div style="position:absolute;inset:0;background:#0A0908;display:flex;align-items:center;justify-content:center">
      <div style="position:relative;width:600px;height:360px;transform-style:preserve-3d;perspective:1200px">
        <div style="position:absolute;inset:0;background:${wc}"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;height:36%;background:${fc}"></div>
        <div style="position:absolute;top:0;left:0;right:0;height:18%;background:${cc};opacity:.8"></div>
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.4) 100%)"></div>
        <div style="position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:Cormorant Garamond,serif;font-style:italic;font-size:20px;color:rgba(233,185,163,.7)">${label}</div>
      </div>
    </div>`;
  }

  $('ba-after').innerHTML  = `<div class="ba-label">After — Your Design</div>` + miniRoom(afterWall,  afterFloor,  afterCeil,  ROOMS[curRoom].name);
  $('ba-before').innerHTML = `<div class="ba-label">Before — Default</div>`    + miniRoom(beforeWall, beforeFloor, beforeCeil, ROOMS[curRoom].name);

  $('ba-overlay').classList.add('active');
  $('btnBA').classList.add('active');
  initBASlider();
}
function closeBA() {
  $('ba-overlay').classList.remove('active');
  $('btnBA').classList.remove('active');
}
function initBASlider() {
  const overlay = $('ba-overlay');
  const divider = $('ba-divider');
  const before  = $('ba-before');
  let dragging = false;

  function setPos(x) {
    const rect = overlay.getBoundingClientRect();
    const pct  = Math.max(5, Math.min(95, ((x - rect.left) / rect.width) * 100));
    divider.style.left = pct + '%';
    before.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
  }

  divider.addEventListener('mousedown',  () => dragging = true);
  divider.addEventListener('touchstart', () => dragging = true, { passive:true });
  overlay.addEventListener('mousemove',  e => { if (dragging) setPos(e.clientX); });
  overlay.addEventListener('touchmove',  e => { if (dragging) setPos(e.touches[0].clientX); }, { passive:true });
  window.addEventListener('mouseup',  () => dragging = false);
  window.addEventListener('touchend', () => dragging = false);
}
</script>
